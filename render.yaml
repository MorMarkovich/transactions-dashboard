services:
  - type: web
    name: transactions-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      # Supabase – set these in the Render dashboard (Settings → Environment)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini-free
      - key: GEMINI_API_KEY
        sync: false
      # Set only after verifying this exact key belongs to an unbilled project.
      - key: GEMINI_FREE_KEY_SHA256
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Verified free account, PAYG off; required even when usage returns null.
      - key: TAVILY_FREE_KEY_SHA256
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://transactions-dashboard-bfxn.onrender.com
      - key: VITE_AUTO_AI
        value: "true"
      # Pending migration and schema checks passed before enabling this release.
      - key: VITE_PENDING_APPROVALS
        value: "true"
