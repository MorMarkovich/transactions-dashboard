services:
  - type: web
    name: transactions-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      # Supabase – set these in the Render dashboard (Settings → Environment)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://transactions-dashboard-bfxn.onrender.com
      - key: VITE_AUTO_AI
        value: "true"
