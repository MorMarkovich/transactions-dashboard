name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      bank-sync: ${{ steps.filter.outputs.bank-sync }}
      backend: ${{ steps.filter.outputs.backend }}
      container: ${{ steps.filter.outputs.container }}
      e2e: ${{ steps.filter.outputs.e2e }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            bank-sync:
              - 'bank-sync/**'
              - 'supabase/**'
              - 'validation/pending-db/**'
            backend:
              - 'backend/**'
            container:
              - 'Dockerfile'
              - 'render.yaml'
              - 'backend/**'
              - 'frontend/**'
            e2e:
              - 'e2e/**'
              - 'frontend/**'
              - 'backend/**'
            workflows:
              - '.github/workflows/**'

  workflow-lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflow YAML OK')"

  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-test.txt
      - run: pip check
      - run: pytest -q

  container:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag transactions-dashboard:ci .

  bank-sync:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bank-sync == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bank-sync/package-lock.json
      - run: npm ci --ignore-scripts
      # Deploy-gate scoping: this audit tracks third-party advisories (puppeteer/zod chain)
      # in the LOCAL-only bank-sync tool, which is not part of the production image
      # (Dockerfile copies only frontend/ and backend/). It stays enforced on PRs that
      # touch bank-sync and on the weekly full security run (schedule trigger above), but a
      # fresh upstream advisory must not block the production web deploy gate (Render
      # autoDeployTrigger: checksPass waits for ALL checks on main). Skipped on push only.
      - run: npm audit --omit=dev --audit-level=high
        if: github.event_name != 'push'
      - run: npm test

  pending-database:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bank-sync == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: pinkas_isolated
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pinkas_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PINKAS_TEST_DB_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/pinkas_isolated
      PINKAS_TEST_API_URL: http://127.0.0.1:55440
      PINKAS_TEST_JWT_SECRET: pinkas-isolated-synthetic-key-for-tests-only
      PINKAS_TEST_REPORT: pending-database-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: bank-sync
      - run: npm ci --ignore-scripts
        working-directory: validation/pending-db
      - run: node validation/pending-db/verify.mjs --prepare
      - name: Start isolated PostgREST
        run: >-
          docker run --detach --rm --name pinkas-test-api --network host
          -e PGRST_DB_URI=postgresql://authenticator:synthetic-test-only@127.0.0.1:5432/pinkas_isolated
          -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon
          -e PGRST_JWT_SECRET="$PINKAS_TEST_JWT_SECRET" -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=55440
          postgrest/postgrest:v16.5
      - run: node validation/pending-db/verify.mjs --prepared
      - if: always()
        run: docker stop pinkas-test-api || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-database-report
          path: pending-database-report.json
          retention-days: 7
