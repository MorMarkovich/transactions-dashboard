name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      bank-sync: ${{ steps.filter.outputs.bank-sync }}
      backend: ${{ steps.filter.outputs.backend }}
      container: ${{ steps.filter.outputs.container }}
      e2e: ${{ steps.filter.outputs.e2e }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            bank-sync:
              - 'bank-sync/**'
            backend:
              - 'backend/**'
            container:
              - 'Dockerfile'
              - 'render.yaml'
              - 'backend/**'
              - 'frontend/**'
            e2e:
              - 'e2e/**'
              - 'frontend/**'
              - 'backend/**'
            workflows:
              - '.github/workflows/**'

  workflow-lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflow YAML OK')"

  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-test.txt
      - run: pip check
      - run: pytest -q

  container:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag transactions-dashboard:ci .

  bank-sync:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.bank-sync == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bank-sync/package-lock.json
      - run: npm ci --ignore-scripts
      # Deploy-gate scoping: this audit tracks third-party advisories (puppeteer/zod chain)
      # in the LOCAL-only bank-sync tool, which is not part of the production image
      # (Dockerfile copies only frontend/ and backend/). It stays enforced on PRs that
      # touch bank-sync and on the weekly full security run (schedule trigger above), but a
      # fresh upstream advisory must not block the production web deploy gate (Render
      # autoDeployTrigger: checksPass waits for ALL checks on main). Skipped on push only.
      - run: npm audit --omit=dev --audit-level=high
        if: github.event_name != 'push'
      - run: npm test
