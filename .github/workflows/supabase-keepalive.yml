name: Supabase keep-alive

on:
  schedule:
    - cron: '23 5 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register activity on the Supabase project
        env:
          SUPABASE_URL: https://jcyahiylnbfddzyqzbbg.supabase.co
          # Public anon key - the same one served to every visitor in the frontend bundle.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjeWFoaXlsbmJmZGR6eXF6YmJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NjQxNjAsImV4cCI6MjA4NjA0MDE2MH0.nxk34GH-vPmC3IKkmusZy4R2Y1g8coUz4JcR7_o4ldY
        run: |
          curl -fsS -m 30 "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
          curl -fsS -m 30 "$SUPABASE_URL/rest/v1/saved_transactions?select=user_id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -o /dev/null
          echo "Supabase keep-alive ping OK"
